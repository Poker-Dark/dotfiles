# 鼠标支持：滚轮翻页、点击切窗格、拖动调大小
set -g mouse on

# 回看行数加到 5 万
set -g history-limit 50000

# 窗口编号从 1 开始，且关闭后自动重排
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 关掉 <C-b> 的延迟感
set -s escape-time 10

# 用 | 和 - 分屏，更直观
bind | split-window -h
bind - split-window -v

# 状态栏更简洁
set -g status-bg colour235
set -g status-fg white
